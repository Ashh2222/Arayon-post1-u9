spring.application.name=seguridad-web

# Base de datos (credenciales por variable de entorno, con valor por defecto local)
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:cambiar}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Thymeleaf
spring.thymeleaf.cache=false